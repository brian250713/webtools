<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSL 檢測指南｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>SSL/TLS 檢測指南</h1><div class="card"><h3>推薦檢測</h3><p>SSL Labs、SSL Shopper、DigiCert（外部連結），瀏覽器鎖頭看有效期，OpenSSL 指令：</p><pre>openssl s_client -connect example.com:443 -servername example.com | openssl x509 -noout -dates -issuer -ext subjectAltName</pre></div><div class="card"><h3>常見問題</h3><p>中繼缺失→補 chain；過期→自動續期；混合內容→全站 https；TLS 僅留 1.2+。</p></div></div></body></html>
