<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 格式化｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>JSON 格式化</h1><p class="note">本地驗證・美化・壓縮，不上傳。</p><textarea id="in" placeholder='貼上 JSON，例如 {"a":1}'></textarea><div class="toolbar"><button id="b1">美化</button><button id="b2" class="ghost">壓縮</button><button id="b3" class="ghost">驗證</button><button id="b4" class="ghost">清空</button><button id="b5" class="ghost">複製結果</button></div><div id="msg"></div><pre id="out">// 結果顯示於此</pre><script>
const $=id=>document.getElementById(id);
function run(mode){const v=$('in').value;if(!v.trim()){$('msg').innerHTML='<p class="err">請先貼上 JSON</p>';return;}try{const o=JSON.parse(v);$('out').textContent=mode==='min'?JSON.stringify(o):JSON.stringify(o,null,2);$('msg').innerHTML='<p class="ok">✓ 有效 JSON</p>';}catch(e){$('msg').innerHTML='<p class="err">✗ '+e.message+'</p>';$('out').textContent='// 解析失敗';}}
$('b1').onclick=()=>run('pretty');$('b2').onclick=()=>run('min');$('b3').onclick=()=>run('pretty');$('b4').onclick=()=>{$('in').value='';$('out').textContent='// 結果顯示於此';$('msg').textContent='';};$('b5').onclick=()=>navigator.clipboard.writeText($('out').textContent);
</script></div></body></html>
