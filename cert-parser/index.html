<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>憑證解析器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>SSL 憑證解析器</h1><p class="note">本地解析 PEM 文字結構（Base64 解碼 + 有效期需手動對照），不上傳。</p><textarea id="in" placeholder="貼上 -----BEGIN CERTIFICATE-----"></textarea><div class="toolbar"><button id="go">解析</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const v=$('in').value;const m=v.match(/-----BEGIN [^-]+-----([\s\S]+?)-----END/);if(!m){$('out').textContent='找不到 PEM 區塊';return;}try{const b=Uint8Array.from(atob(m[1].replace(/\s/g,'')),c=>c.charCodeAt(0));$('out').textContent=`DER 長度 ${b.length} bytes\n開頭 ${[...b.slice(0,8)].map(x=>x.toString(16).padStart(2,'0')).join(' ')}\n提示：完整 X.509 欄位解析需 ASN.1 庫，此版僅做本機 PEM 有效性檢查。SAN/有效期請以瀏覽器鎖頭資訊為準。`;}catch(e){$('out').textContent='Base64 解碼失敗';}};
</script></div></body></html>
