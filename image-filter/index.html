<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>濾鏡效果｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>濾鏡效果</h1><input type="file" id="f" accept="image/*"><div class="toolbar"><select id="t"><option value="grayscale(1)">黑白</option><option value="sepia(1)">復古</option><option value="blur(2px)">模糊</option><option value="contrast(1.5)">銳化感</option></select><button id="go">套用下載</button></div><img id="p" style="max-width:100%"><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const f=$('f').files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.filter=$('t').value;x.drawImage(img,0,0);$('p').src=c.toDataURL();const a=document.createElement('a');a.href=$('p').src;a.download='filtered.png';a.click();};img.src=URL.createObjectURL(f);};
</script></div></body></html>
