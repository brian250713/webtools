<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密碼強度檢測｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>密碼強度檢測</h1><input id="in" type="text" placeholder="輸入密碼（僅本地計算）"><pre id="out"></pre><p class="note">參照 NIST 2025 概念：長度優先，本地估算破解時間。</p><script>
const $=id=>document.getElementById(id);
$('in').addEventListener('input',()=>{const v=$('in').value;let pool=0;if(/[a-z]/.test(v))pool+=26;if(/[A-Z]/.test(v))pool+=26;if(/\d/.test(v))pool+=10;if(/[^A-Za-z0-9]/.test(v))pool+=32;const ent=v.length*Math.log2(pool||1);const score=ent>80?5:ent>60?4:ent>40?3:ent>20?2:1;$('out').textContent=`長度 ${[...v].length}\n熵約 ${ent.toFixed(0)} bits\n強度 ${'★'.repeat(score)}${'☆'.repeat(5-score)}\n破解估算(1e10/s) ${pool?(Math.pow(pool,v.length)/1e10/31536000).toExponential(1)+' 年':'-'}\n建議：${v.length<12?'加長到 12+；':''}${pool<60?'混用大小寫+數字+符號；':''}避免字典詞。`;});
</script></div></body></html>
