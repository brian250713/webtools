<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音頻裁剪｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>音頻裁剪器</h1><input type="file" id="f" accept="audio/*"><div class="row"><div>起(秒)<input id="a" type="number" value="0"></div><div>迄(秒)<input id="b" type="number" value="10"></div></div><div class="toolbar"><button id="go">裁剪下載 WAV</button></div><pre id="o">本機 WebAudio 裁剪，不上傳。</pre><script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{const f=$('f').files[0];if(!f)return;const ctx=new AudioContext();const buf=await ctx.decodeAudioData(await f.arrayBuffer());const a=+$('a').value||0,b=+$('b').value||10;const sr=buf.sampleRate,s=Math.floor(a*sr),e=Math.min(buf.length,Math.floor(b*sr));const o=ctx.createBuffer(buf.numberOfChannels,e-s,sr);for(let c=0;c<o.numberOfChannels;c++)o.getChannelData(c).set(buf.getChannelData(c).slice(s,e));const wav=enc(o);const al=document.createElement('a');al.href=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));al.download='trimmed.wav';al.click();$('o').textContent=`已裁 ${a}s→${b}s`;};
function enc(buf){const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate;const b=new DataView(new ArrayBuffer(44+n*ch*2));const W=(o,s)=>{for(let i=0;i<s.length;i++)b.setUint8(o+i,s.charCodeAt(i));};W(0,'RIFF');b.setUint32(4,36+n*ch*2,true);W(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,ch,true);b.setUint32(24,sr,true);b.setUint32(28,sr*ch*2,true);b.setUint16(32,ch*2,true);b.setUint16(34,16,true);W(36,'data');b.setUint32(40,n*ch*2,true);let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));b.setInt16(o,v<0?v*32768:v*32767,true);o+=2;}return b.buffer;}
</script></div></body></html>
