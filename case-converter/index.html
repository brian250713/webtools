<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大小寫轉換｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>大小寫轉換</h1><textarea id="in" placeholder="hello_world-example text"></textarea><div class="toolbar"><button data-f="camel">camelCase</button><button data-f="pascal" class="ghost">PascalCase</button><button data-f="snake" class="ghost">snake_case</button><button data-f="kebab" class="ghost">kebab-case</button><button data-f="upper" class="ghost">UPPER</button><button data-f="lower" class="ghost">lower</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
const words=s=>s.split(/[\s_\-]+|(?=[A-Z])/).filter(Boolean).map(w=>w.toLowerCase());
document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{const v=$('in').value,w=words(v);const f=b.dataset.f;$('out').textContent=f==='camel'?w.map((x,i)=>i?w[0].toUpperCase()+x.slice(1):x).join('').replace(/^./,c=>c.toLowerCase()):f==='pascal'?w.map(x=>x[0].toUpperCase()+x.slice(1)).join(''):f==='snake'?w.join('_'):f==='kebab'?w.join('-'):f==='upper'?v.toUpperCase():v.toLowerCase();});
</script></div></body></html>
