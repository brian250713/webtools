<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖片壓縮｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>圖片壓縮</h1><input type="file" id="f" accept="image/*"><div class="toolbar"><select id="q"><option value="0.8">品質 0.8</option><option value="0.6">0.6</option><option value="0.9">0.9</option></select><button id="go">壓縮下載</button></div><img id="p" style="max-width:100%"><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const f=$('f').files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,1600/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);$('p').src=c.toDataURL('image/jpeg',+$('q').value);const a=document.createElement('a');a.href=$('p').src;a.download='compressed.jpg';a.click();};img.src=URL.createObjectURL(f);};
</script></div></body></html>
