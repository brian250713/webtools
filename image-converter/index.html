<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖片格式轉換｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>圖片格式轉換</h1><input type="file" id="f" accept="image/*"><div class="toolbar"><select id="t"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select><button id="go">轉換下載</button></div><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const f=$('f').files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);const a=document.createElement('a');a.href=c.toDataURL($('t').value,0.9);a.download='converted.'+($('t').value.split('/')[1]);a.click();};img.src=URL.createObjectURL(f);};
</script></div></body></html>
