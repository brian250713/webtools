<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色彩工具｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>色彩工具</h1><div class="row"><div><input type="color" id="p" value="#2563eb" style="height:48px"> <span id="hex">#2563EB</span></div><div><input type="text" id="hin" placeholder="#2563eb 或 rgb(37,99,235)"></div></div><div class="toolbar"><button id="a">解析 / 轉換</button><button id="pal" class="ghost">生成調色盤</button></div><pre id="out"></pre><div class="grid" id="sw"></div><script>
const $=id=>document.getElementById(id);
function toHsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h=0,s=0,l=(M+m)/2;if(M!==m){const d=M-m;s=l>0.5?d/(2-M-m):d/(M+m);switch(M){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}h*=60;}return[h.toFixed(0), (s*100).toFixed(0),(l*100).toFixed(0)];}
function parse(v){v=v.trim();let m=v.match(/^#?([0-9a-f]{6})$/i);if(m){const h=m[1];return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}m=v.match(/rgb\s*\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);if(m)return{r:+m[1],g:+m[2],b:+m[3]};return null;}
function show(r,g,b){const hex='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();$('hex').textContent=hex;$('p').value=hex;$('out').textContent=`HEX ${hex}\nRGB rgb(${r}, ${g}, ${b})\nHSL hsl(${toHsl(r,g,b).join(', ')})`;}
$('p').oninput=e=>{const c=e.target.value;const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);show(r,g,b);};
$('a').onclick=()=>{const c=parse($('hin').value||$('p').value);if(!c){$('out').textContent='無法解析';return;}show(c.r,c.g,c.b);};
$('pal').onclick=()=>{const c=parse($('p').value);const box=$('sw');box.innerHTML='';[0,30,60,180,210].forEach(d=>{const[h,s,l]=toHsl(c.r,c.g,c.b);const div=document.createElement('div');div.className='card';div.innerHTML=`<div style="height:48px;border-radius:8px;background:hsl(${(+h+d)%360},${s}%,${l}%)"></div><small>hsl(${((+h+d)%360).toFixed(0)}, ${s}%, ${l}%)</small>`;box.appendChild(div);});};
$('a').click();
</script></div></body></html>
