<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 工具｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>PDF 操作（本機資訊）</h1><input type="file" id="f" accept=".pdf"><pre id="o">選擇 PDF 顯示大小、類型與前幾 bytes，不上傳。完整文字提取需 pdf.js，後續再加。</pre><script>const $=id=>document.getElementById(id);$('f').onchange=async()=>{const f=$('f').files[0];const b=new Uint8Array(await f.slice(0,8).arrayBuffer());$('o').textContent=`檔名 ${f.name}\n大小 ${(f.size/1024).toFixed(1)} KB\n類型 ${f.type||'application/pdf'}\n檔頭 ${[...b].map(x=>x.toString(16)).join(' ')}`;}</script></div></body></html>
