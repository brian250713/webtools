<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitemap 驗證器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>Sitemap 驗證器</h1><textarea id="in" placeholder="貼上 sitemap.xml"></textarea><div class="toolbar"><button id="go">驗證</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{try{const d=new DOMParser().parseFromString($('in').value,'text/xml');if(d.querySelector('parsererror'))throw 0;const urls=[...d.querySelectorAll('url loc, sitemap loc')].map(x=>x.textContent.trim());const dup=urls.filter((u,i)=>urls.indexOf(u)!==i);$('out').textContent=`URL 數 ${urls.length}\n重複 ${dup.length?[...new Set(dup)].join(', '):'無'}\n缺 loc ${d.querySelectorAll('url').length-[...d.querySelectorAll('url loc')].length}`;}catch(e){$('out').textContent='XML 格式錯誤';}};
</script></div></body></html>
