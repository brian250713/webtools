<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email 標頭分析｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>Email 標頭分析器</h1><p class="note">本地解析 Received 路徑與 SPF/DKIM/DMARC 標頭存在性，不做線上驗證。</p><textarea id="in" placeholder="貼上原始標頭"></textarea><div class="toolbar"><button id="go">分析</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const v=$('in').value;const g=n=>(v.match(new RegExp('^'+n+':.*','gim'))||[]);const rec=g('Received');$('out').textContent=`From: ${g('From')[0]||'-'}\nTo: ${g('To')[0]||'-'}\nSubject: ${g('Subject')[0]||'-'}\nReceived 跳數 ${rec.length}\n${rec.slice(0,5).join('\n')}\nSPF: ${g('Received-SPF')[0]||'無標頭'}\nDKIM: ${g('DKIM-Signature')[0]?'有簽名標頭':'無標頭'}\nDMARC: ${g('DMARC')[0]||'無標頭'}\n提醒：釣魚請核對 Return-Path 與 From 是否一致。`;};
</script></div></body></html>
