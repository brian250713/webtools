<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正則測試器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>正則測試器</h1><input id="re" type="text" placeholder="例如 ^\d{4}-\d{2}-\d{2}$"><div class="toolbar"><label><input type="checkbox" id="g" checked> g</label><label><input type="checkbox" id="i"> i</label><label><input type="checkbox" id="m"> m</label><button id="a">測試</button></div><textarea id="in" placeholder="待測文字"></textarea><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
$('a').onclick=()=>{try{let f='';if($('g').checked)f+='g';if($('i').checked)f+='i';if($('m').checked)f+='m';const re=new RegExp($('re').value,f);const ms=[...$('in').value.matchAll(re)].slice(0,50);$('out').textContent=ms.length?ms.map((m,i)=>`${i+1}. ${m[0]} @${m.index}`).join('\n'):'無匹配';}catch(e){$('out').textContent='正則錯誤：'+e.message;}};
</script></div></body></html>
