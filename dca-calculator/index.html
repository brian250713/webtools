<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCA 計算機｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>DCA 計算機</h1><div class="row"><div>每月<input id="m" type="number" value="10000"></div><div>年數<input id="y" type="number" value="10"></div><div>年化%<input id="r" type="number" value="7"></div></div><div class="toolbar"><button id="go">試算</button></div><pre id="o"></pre><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const m=+$('m').value,y=+$('y').value,r=+$('r').value/100/12,n=y*12;const fv=m*((Math.pow(1+r,n)-1)/r);const tot=m*n;$('o').textContent=`投入總額 ${tot.toLocaleString()}\n期末資產約 ${Math.round(fv).toLocaleString()}\n獲利約 ${Math.round(fv-tot).toLocaleString()}\nROI ${(tot?((fv-tot)/tot*100).toFixed(1):0)}%`;};
$('go').click();
</script></div></body></html>
