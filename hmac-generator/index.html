<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMAC 生成器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>HMAC 生成器</h1><input id="k" type="text" placeholder="密鑰 key"><textarea id="in" placeholder="訊息 message"></textarea><div class="toolbar"><button id="a">HMAC-SHA256</button><button id="b" class="ghost">HMAC-SHA512</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
async function h(name){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode($('k').value),{name:'HMAC',hash:name},false,['sign']);const s=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode($('in').value));$('out').textContent=[...new Uint8Array(s)].map(x=>x.toString(16).padStart(2,'0')).join('');}
$('a').onclick=()=>h('SHA-256');$('b').onclick=()=>h('SHA-512');
</script></div></body></html>
