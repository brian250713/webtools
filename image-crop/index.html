<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圖片裁剪｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>圖片裁剪（中央正方形）</h1><input type="file" id="f" accept="image/*"><div class="toolbar"><button id="go">裁剪下載</button></div><script>
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const f=$('f').files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=s;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,s,s);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='cropped.png';a.click();};img.src=URL.createObjectURL(f);};
</script></div></body></html>
