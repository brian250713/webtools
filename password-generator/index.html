<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密碼生成器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>密碼生成器</h1><div class="row"><div>長度 <input id="len" type="number" value="16" min="4" max="128"></div><div>數量 <input id="n" type="number" value="5" min="1" max="20"></div></div><div class="toolbar"><label><input type="checkbox" id="lo" checked> 小寫</label><label><input type="checkbox" id="up" checked> 大寫</label><label><input type="checkbox" id="di" checked> 數字</label><label><input type="checkbox" id="sy" checked> 符號</label></div><div class="toolbar"><button id="g">生成</button><button id="c" class="ghost">複製第一個</button></div><pre id="out"></pre><p class="note">使用 crypto.getRandomValues，本地生成不記錄。</p><script>
const $=id=>document.getElementById(id);
$('g').onclick=()=>{let s='';if($('lo').checked)s+='abcdefghijkmnopqrstuvwxyz';if($('up').checked)s+='ABCDEFGHJKLMNPQRSTUVWXYZ';if($('di').checked)s+='23456789';if($('sy').checked)s+='!@#$%^&*()-_=+[]{}';if(!s){$('out').textContent='請至少勾選一種字元';return;}const L=+$('len').value||16,N=+$('n').value||5,r=[];for(let i=0;i<N;i++){const b=new Uint32Array(L);crypto.getRandomValues(b);r.push([...b].map(x=>s[x%s.length]).join(''));}$('out').textContent=r.join('\n');};
$('c').onclick=()=>navigator.clipboard.writeText($('out').textContent.split('\n')[0]||'');$('g').click();
</script></div></body></html>
