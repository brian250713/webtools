<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隨機生成器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>隨機生成器</h1><div class="row"><input id="a" type="number" value="1" placeholder="min"><input id="b" type="number" value="100" placeholder="max"><input id="n" type="number" value="5" placeholder="個數"></div><div class="toolbar"><button id="go">數字</button><button id="s" class="ghost">字串(12)</button><button id="c" class="ghost">顏色</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);const r=n=>{const b=new Uint32Array(n);crypto.getRandomValues(b);return[...b];};
$('go').onclick=()=>{const a=+$('a').value,b=+$('b').value,n=+$('n').value||5;$('out').textContent=r(n).map(x=>a+x%(b-a+1)).join('\n');};
$('s').onclick=()=>{const ch='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';$('out').textContent=r(5).map(x=>[...crypto.getRandomValues(new Uint8Array(12))].map(y=>ch[y%ch.length]).join('')).join('\n');};
$('c').onclick=()=>{$('out').textContent=r(5).map(x=>'#'+(x%0xFFFFFF).toString(16).padStart(6,'0').toUpperCase()).join('\n');};
</script></div></body></html>
