<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字加密解密｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>文字加密解密</h1><p class="note">AES-GCM 本地加解密，需自記密碼，忘記即無法還原。</p><input id="pw" type="text" placeholder="密碼"><textarea id="in" placeholder="明文或密文(Base64)"></textarea><div class="toolbar"><button id="e">加密</button><button id="d" class="ghost">解密</button></div><pre id="out"></pre><script>
const $=id=>document.getElementById(id);
async function key(pw,salt){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
$('e').onclick=async()=>{const iv=crypto.getRandomValues(new Uint8Array(12)),salt=crypto.getRandomValues(new Uint8Array(16));const k=await key($('pw').value,salt);const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode($('in').value)));const all=new Uint8Array([...salt,...iv,...c]);$('out').textContent=btoa(String.fromCharCode(...all));};
$('d').onclick=async()=>{try{const all=Uint8Array.from(atob($('in').value.trim()),c=>c.charCodeAt(0));const k=await key($('pw').value,all.slice(0,16));const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},k,all.slice(28));$('out').textContent=new TextDecoder().decode(p);}catch(e){$('out').textContent='解密失敗：密碼或格式錯誤';}};
</script></div></body></html>
