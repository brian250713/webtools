<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>條碼生成器｜線上工具</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="wrap"><a href="../">← 目錄</a><h1>條碼生成器</h1><input id="t" type="text" value="123456789012"><div class="toolbar"><button id="go">生成 Code128</button></div><svg id="b"></svg><p class="note">JsBarcode CDN 本地繪製。</p><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.8.0/dist/JsBarcode.all.min.js"></script><script>const $=id=>document.getElementById(id);$('go').onclick=()=>{try{JsBarcode('#b',$('t').value||'0',{format:'CODE128'});}catch(e){}};$('go').click();</script></div></body></html>
